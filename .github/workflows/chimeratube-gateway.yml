name: ChimeraTube gateway integration
on:
  push:
    paths: ['chimeratube/**', '.github/workflows/chimeratube-gateway.yml']
  pull_request:
    paths: ['chimeratube/**', '.github/workflows/chimeratube-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chimeratube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -B -m unittest -v test_gateway
      - run: docker compose config --quiet
