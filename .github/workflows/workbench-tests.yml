name: Workbench tests
on:
  push:
    paths:
      - 'workbench/**'
      - '.github/workflows/workbench-tests.yml'
  pull_request:
    paths:
      - 'workbench/**'
      - '.github/workflows/workbench-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q core.py server.py docker_entrypoint.py tests
      - run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/chimera-ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/chimera-ui.js
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.amd.yml config --quiet
