name: Kotlin parser tests
on:
  push:
    branches: [local-ollama-workbench]
    paths:
      - 'parser-tests/**'
      - '.github/workflows/parser-tests.yml'
  pull_request:
    paths:
      - 'parser-tests/**'
      - '.github/workflows/parser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parser-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Kotlin and run six JUnit tests
        run: gradle --no-daemon clean test --console=plain
      - name: Summarize JUnit results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('build/test-results/test').glob('TEST-*.xml'))
          if not reports:
              text = 'No JUnit reports were produced. Check compilation, setup, and dependency-download logs. No test pass is claimed.'
          else:
              totals = dict(tests=0, failures=0, errors=0, skipped=0)
              for report in reports:
                  suite = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(suite.get(key, '0'))
              text = 'JUnit result: ' + ', '.join(f'{key}={value}' for key, value in totals.items())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## SSP parser unit tests\n\n' + text + '\n')
          PY
      - name: Upload XML and HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-test-reports
          path: |
            parser-tests/build/test-results/test/
            parser-tests/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
