name: JavaBoy component checks
on:
  push:
    paths: ['javaboy/**', '.github/workflows/javaboy-tests.yml']
  pull_request:
    paths: ['javaboy/**', '.github/workflows/javaboy-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test javaboy/test/host.test.mjs
      - run: |
          mkdir -p javaboy/build/test
          javac -d javaboy/build/test javaboy/java/com/javaboy/chimera/Core.java javaboy/java/com/javaboy/chimera/Keys.java javaboy/java/com/javaboy/chimera/Runner.java javaboy/java/com/javaboy/chimera/Diagnostic.java javaboy/test/PortableTest.java
          java -cp javaboy/build/test com.javaboy.chimera.PortableTest
      - run: python javaboy/build.py --help
