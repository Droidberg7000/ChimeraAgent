name: Android app and shared parser
on:
  push:
    branches: [local-ollama-workbench]
    paths: ['android/**', 'parser-tests/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', 'parser-tests/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK baseline
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test shared parser and endpoint policy, lint, and build debug APKs
        run: gradle --no-daemon :parser:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Upload debug app and instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: chimera-android-debug-apks
          path: android/app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            parser-tests/build/reports/tests/
            parser-tests/build/test-results/
          if-no-files-found: warn
          retention-days: 7
