name: ChimeraTube portable client core
on:
  push:
    paths: ['chimeratube/**', '.github/workflows/chimeratube-client.yml']
  pull_request:
    paths: ['chimeratube/**', '.github/workflows/chimeratube-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chimeratube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile portable code, not a vendor MIDlet build
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core client/src/com/chimeratube/Feed.java client/src/com/chimeratube/Cleanup.java client/test/com/chimeratube/CoreTest.java
          java -cp build/core com.chimeratube.CoreTest
