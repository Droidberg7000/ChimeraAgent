services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: '0.0.0.0:11434'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  model-init:
    image: ollama/ollama:latest
    restart: 'no'
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: 'http://ollama:11434'
      OLLAMA_MODEL: '${OLLAMA_MODEL:-qwen3:4b}'
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        attempt=1
        until ollama pull "$${OLLAMA_MODEL}"; do
          if [ "$${attempt}" -ge 3 ]; then
            echo 'Model pull failed after three attempts.' >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 10
        done
        echo "Model ready: $${OLLAMA_MODEL}"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: chimera-agent:local
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: 'http://ollama:11434'
      CHIMERA_ALLOW_COMMANDS: '${CHIMERA_ALLOW_COMMANDS:-false}'
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - agent_workspace:/workspace
      - agent_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  agent_workspace:
  agent_data:
  ollama_models:
