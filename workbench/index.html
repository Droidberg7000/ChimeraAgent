<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chimera Local Workbench</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0c1118;color:#dce7f4}*{box-sizing:border-box}body{margin:0}header{padding:16px;background:#152131;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:19px;color:#8bd6ba;margin:0}.layout{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 90px)}aside{padding:12px;overflow:auto;border-right:1px solid #34465b}main{display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0;min-width:0}button,select,textarea{font:inherit;color:inherit;background:#19283b;border:1px solid #47607a;border-radius:5px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#sessions button,#filelist button{display:block;width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere}#chat{flex:1;overflow:auto;min-height:100px}.message{background:#121d2a;border-left:3px solid #617e9e;padding:10px;margin:10px 0}.user{border-color:#8bd6ba}.tool{border-color:#bf9ae3}.role,.muted{font-size:12px;color:#adc1d6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace}form,.toolbar{display:flex;gap:8px;flex-wrap:wrap}textarea{flex:1;min-height:75px}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}.panel{background:#152131;border:1px solid #607a95;padding:20px;width:min(950px,95vw);max-height:90vh;overflow:auto}.hidden{display:none}.selected{border-color:#8bd6ba}#status{flex:1}@media(max-width:650px){.layout{grid-template-columns:140px 1fr}main,aside{padding:7px}}
</style></head><body>
<header><h1>CHIMERA / LOCAL</h1><select id="model" aria-label="Model"></select><button id="refresh">Models</button><select id="mode" aria-label="Mode"><option value="agent">Agent + tools</option><option value="chat">Chat only</option></select><span id="status">Connecting...</span></header>
<div class="layout"><aside><button id="new">New session</button><div id="sessions"></div><hr><button id="files">Workspace files</button><div id="filelist"></div><p id="config" class="muted"></p></aside><main><div class="toolbar"><button id="export">Export</button><button id="audit">Audit log</button><button id="command" disabled>Run command</button><button id="stop" disabled>Stop</button><button id="reconnect">Reload session</button></div><div id="chat" aria-live="polite"></div><form id="form"><textarea id="prompt" aria-label="Message" placeholder="Enter sends; Shift+Enter adds a line"></textarea><button id="send">Send</button></form><p class="muted">Review every approval. Commands are not sandboxed.</p></main></div>
<div id="modal" class="overlay hidden"><div class="panel"><h2 id="title"></h2><pre id="preview"></pre><div id="buttons" class="toolbar"></div></div></div>
<script>
'use strict';
const TOKEN='__TOKEN__';
const $=id=>document.getElementById(id);
let session=null,run=null,assistant=null,enabled=false,generation=0;
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'X-Chimera-Token':TOKEN,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok){let e;try{e=await r.json()}catch{e={detail:r.statusText}}throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}return r.json()}
function status(t){$('status').textContent=t}function error(e){status('Error: '+e.message)}
function message(role,text,cls=''){const box=document.createElement('div');box.className='message '+cls;const label=document.createElement('div');label.className='role';label.textContent=role;const pre=document.createElement('pre');pre.textContent=text;box.append(label,pre);$('chat').append(box);scroll();return pre}function scroll(){$('chat').scrollTop=$('chat').scrollHeight}
function busy(on){$('send').disabled=on;$('stop').disabled=!on;$('new').disabled=on;$('command').disabled=on||!enabled;$('model').disabled=on;$('mode').disabled=on}
function closeModal(){$('modal').classList.add('hidden')}
function modal(title,text,buttons){$('title').textContent=title;$('preview').textContent=text;$('buttons').replaceChildren();for(const [name,fn] of buttons){const b=document.createElement('button');b.textContent=name;b.onclick=fn;$('buttons').append(b)}$('modal').classList.remove('hidden')}
async function sessions(){const rows=await api('sessions');$('sessions').replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=row.title;b.className=row.id===session?'selected':'';b.onclick=()=>{if(!run)openSession(row.id).catch(error)};$('sessions').append(b)}}
async function openSession(id){generation++;session=id;assistant=null;$('chat').replaceChildren();const data=await api('sessions/'+id);for(const turn of data.turns)for(const m of turn){if(m.role==='tool')message('tool / '+m.tool_name,m.content,'tool');else if(m.content)message(m.role,m.content,m.role==='user'?'user':'')}await sessions();run=data.active_run;busy(Boolean(run));if(run)await watch(run);else status('Ready')}
async function models(){const data=await api('models'),old=$('model').value;$('model').replaceChildren();for(const m of data.models||[]){if(m.name.toLowerCase().includes('cloud'))continue;const o=document.createElement('option');o.value=o.textContent=m.name;$('model').append(o)}if([...$('model').options].some(o=>o.value===old))$('model').value=old;status($('model').value?'Ready':'No local models; download one in Ollama.')}
async function files(path='.'){const rows=await api('files?path='+encodeURIComponent(path));$('filelist').replaceChildren();if(path!=='.'){const b=document.createElement('button');b.textContent='Root /';b.onclick=()=>files().catch(error);$('filelist').append(b)}for(const item of rows){const b=document.createElement('button'),name=path==='.'?item.name:path+'/'+item.name;b.textContent=(item.directory?'[dir] ':'')+item.name;b.onclick=()=>{if(item.directory)files(name).catch(error);else api('file?path='+encodeURIComponent(name)).then(v=>modal(name,v.content,[['Close',closeModal]])).catch(error)};$('filelist').append(b)}}
async function decide(rid,id,approve){try{await api('runs/'+rid+'/approval','POST',{id,approve});closeModal()}catch(e){closeModal();error(e)}}
function handle(e,rid){switch(e.type){case'assistant_start':assistant=message('assistant','');status('Generating...');break;case'token':if(!assistant)assistant=message('assistant','');assistant.textContent+=e.text;scroll();break;case'context':if(e.dropped_turns)message('context',e.dropped_turns+' older turns omitted.');break;case'tool_start':status('Tool: '+e.name);break;case'tool_result':message('tool / '+e.name,JSON.stringify(e.result,null,2),'tool');break;case'approval':status('Waiting for approval');modal('Approve '+e.action+'?',JSON.stringify(e.preview,null,2),[['Approve exact action',()=>decide(rid,e.id,true)],['Deny',()=>decide(rid,e.id,false)]]);break;case'approval_resolved':closeModal();status(e.approved?'Approved':'Denied / expired');break;case'error':message('error',e.text);break;case'notice':message('notice',e.text);break;case'metrics':status('Generated '+(e.generated_tokens??'?')+' tokens');break;case'done':closeModal();status(e.cancelled?'Cancelled':'Ready');break}}
async function watch(rid){const mine=++generation;let cursor=0,done=false,retries=0;try{while(!done&&mine===generation){try{const response=await fetch('/api/runs/'+rid+'/events?after='+cursor,{headers:{'X-Chimera-Token':TOKEN}});if(!response.ok)throw Error('Event stream unavailable');const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const part=await reader.read();if(part.done)break;pending+=decoder.decode(part.value,{stream:true});let end;while((end=pending.indexOf('\n'))>=0){const line=pending.slice(0,end);pending=pending.slice(end+1);if(!line)continue;const e=JSON.parse(line);cursor=e.cursor;if(mine!==generation){await reader.cancel();return}handle(e,rid);if(e.type==='done')done=true}}if(!done)throw Error('Stream interrupted')}catch(e){if(++retries>3)throw e;status('Reconnecting...');await new Promise(r=>setTimeout(r,1000*retries))}}}catch(e){error(e);message('notice','Run may still be active. Use Reload session to reconnect.')}finally{if(mine===generation){run=null;busy(false);await sessions();await files().catch(()=>{})}}}
async function ensureSession(title){if(!session){session=(await api('sessions','POST',{title:title.slice(0,100)})).id;await sessions()}}
$('form').onsubmit=async e=>{e.preventDefault();if(run)return;const text=$('prompt').value.trim();if(!text)return;try{if(!$('model').value)throw Error('Select a downloaded local model');await ensureSession(text);const r=await api('sessions/'+session+'/runs','POST',{text,model:$('model').value,mode:$('mode').value});message('user',text,'user');$('prompt').value='';run=r.id;busy(true);await watch(run)}catch(e){error(e)}};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('new').onclick=async()=>{try{const title=prompt('Session name','New session');if(title)await openSession((await api('sessions','POST',{title})).id)}catch(e){error(e)}};
$('refresh').onclick=()=>models().catch(error);$('files').onclick=()=>files().catch(error);$('reconnect').onclick=()=>{if(session)openSession(session).catch(error)};
$('stop').onclick=()=>{if(run)api('runs/'+run+'/cancel','POST',{}).then(()=>status('Cancellation requested')).catch(error)};
$('command').onclick=async()=>{if(run||!enabled)return;try{const raw=prompt('Executable and arguments as JSON array','["git","status","--short"]');if(!raw)return;const argv=JSON.parse(raw),cwd=prompt('Workspace-relative working directory','.');if(cwd===null)return;await ensureSession('Terminal session');const r=await api('sessions/'+session+'/commands','POST',{argv,cwd});message('user','Manual command: '+JSON.stringify({argv,cwd}),'user');run=r.id;busy(true);await watch(run)}catch(e){error(e)}};
$('audit').onclick=()=>{if(session)api('sessions/'+session+'/audit').then(v=>modal('Audit log',JSON.stringify(v,null,2),[['Close',closeModal]])).catch(error)};
$('export').onclick=async()=>{if(!session)return;try{const data=await api('sessions/'+session+'/export'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='chimera-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){error(e)}};
(async()=>{try{const c=await api('config');enabled=c.commands_enabled;busy(false);$('config').textContent=c.workspace+' | commands '+(enabled?'UNSANDBOXED':'disabled');await sessions();await files();await models()}catch(e){error(e)}})();
</script></body></html>
